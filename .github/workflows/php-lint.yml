# Syntax-checks every tracked PHP file.
#
# This replaces the default Node.js CI template the repository was created
# with: there is no package.json, package-lock.json or yarn.lock anywhere, so
# `actions/setup-node` with `cache: npm` errored out before `npm ci` ever ran
# and the check failed on every branch including main. A permanently red check
# is worse than no check, because real failures stop standing out.
#
# `php -l` is what this project is actually verified with — it is a PHP
# application with no build step and no test suite.

name: PHP Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches the version the site runs on in production.
          php-version: '8.4'
          coverage: none

      - name: Syntax-check every tracked PHP file
        run: |
          status=0
          while IFS= read -r file; do
            if ! output=$(php -l "$file" 2>&1); then
              echo "::error file=${file}::${output}"
              status=1
            fi
          done < <(git ls-files '*.php')

          if [ "$status" -eq 0 ]; then
            echo "All $(git ls-files '*.php' | wc -l) PHP files parsed cleanly."
          fi
          exit "$status"
