<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>ShamHost — لوحة استضافة الجوال</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗄️</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ── تسجيل الدخول ── -->
<div class="login-wrap" id="loginView">
  <form class="login" id="loginForm">
    <h1>🗄️ ShamHost</h1>
    <p>لوحة تحكم الاستضافة على جهازك</p>
    <label for="lu">اسم المستخدم</label>
    <input id="lu" autocomplete="username" value="admin" required>
    <label for="lp">كلمة المرور</label>
    <input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn" style="width:100%;margin-top:1.1rem" id="loginBtn">دخول</button>
    <p class="small muted" style="margin-top:1rem">
      نسيت كلمة المرور؟ نفّذ في Termux: <code class="k">shamhost password</code>
    </p>
  </form>
</div>

<!-- ── التطبيق ── -->
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side">
    <div class="brand">
      <span style="font-size:1.5rem">🗄️</span>
      <div><b>ShamHost</b><small>استضافة على جهازك</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div style="margin-top:1rem;padding:0 .6rem">
      <button class="btn ghost sm" id="themeBtn" style="width:100%">🌓 تبديل المظهر</button>
      <button class="btn ghost sm" id="logoutBtn" style="width:100%;margin-top:.4rem">↩ خروج</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="btn ghost sm mob" id="menuBtn">☰</button>
      <h2 id="pageTitle">لوحة القيادة</h2>
      <button class="btn ghost sm" id="refreshBtn">↻ تحديث</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script src="/app.js"></script>
</body>
</html>
